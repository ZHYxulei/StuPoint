version: 2.1

orbs:
  node: circleci/node@5

jobs:
  test:
    docker:
      - image: cimg/php:8.4-node
    steps:
      - checkout

      - restore_cache:
          keys:
            - composer-v1-{{ checksum "composer.lock" }}
            - composer-v1-

      - run:
          name: Install PHP Dependencies
          command: composer install --no-interaction --prefer-dist --optimize-autoloader

      - save_cache:
          key: composer-v1-{{ checksum "composer.lock" }}
          paths:
            - vendor

      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-

      - run:
          name: Install Node Dependencies
          command: npm ci

      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: Prepare Environment
          command: |
            cp .env.example .env
            php artisan key:generate

      - run:
          name: Build Assets
          command: npm run build

      - run:
          name: Run Tests
          command: php vendor/bin/pest --coverage --coverage-clover=coverage.xml

      - store_test_results:
          path: coverage.xml

      - store_artifacts:
          path: coverage.xml
          destination: coverage

workflows:
  test:
    jobs:
      - test
